    function getScore(m, preds) {
      const p = preds[m.mid];
      return p ? { hs: p.h, as: p.a } : { hs: m.hs, as: m.as };
    }

    function computeStandings(groupMatches, preds) {
      const teams = {};
      groupMatches.forEach(m => {
        const { hs, as } = getScore(m, preds);
        [m.h, m.a].forEach(t => {
          if (!teams[t]) teams[t] = { name:t, p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0, tla:'', areaName:'' };
        });
        teams[m.h].p++; teams[m.a].p++;
        teams[m.h].gf += hs; teams[m.h].ga += as;
        teams[m.a].gf += as; teams[m.a].ga += hs;
        if (hs > as) { teams[m.h].w++; teams[m.h].pts += 3; teams[m.a].l++; }
        else if (hs < as) { teams[m.a].w++; teams[m.a].pts += 3; teams[m.h].l++; }
        else { teams[m.h].d++; teams[m.h].pts++; teams[m.a].d++; teams[m.a].pts++; }
      });
      Object.values(teams).forEach(t => t.gd = t.gf - t.ga);
      return Object.values(teams).sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
    }

    function resolveWCBracket(seeds) {
      const r = JSON.parse(JSON.stringify(wcBracketData));
      for (let ri = 1; ri < wcRoundMeta.length; ri++) {
        const prev = wcRoundMeta[ri-1].id;
        const curr = wcRoundMeta[ri].id;
        r[curr].forEach((m,mi) => {
          m.h = getWCWinner(prev, mi*2, seeds, true) || 'Winner TBD';
          m.a = getWCWinner(prev, mi*2+1, seeds, true) || 'Winner TBD';
        });
      }
      return r;
    }

    function getWCWinner(roundId, midx, seeds, noScore) {
      const m = wcBracketData[roundId][midx];
      const seed = seeds[roundId+'-'+midx];
      if (seed) return seed;
      if (!noScore) {
        const hs = parseInt(m.hs), as = parseInt(m.as);
        if (!isNaN(hs) && !isNaN(as)) {
          if (hs > as) return m.h;
          if (as > hs) return m.a;
        }
      }
      const ri = wcRoundMeta.findIndex(r => r.id === roundId);
      if (ri >= 0 && ri < wcRoundMeta.length-1) {
        const nextId = wcRoundMeta[ri+1].id;
        const nextM = wcBracketData[nextId][Math.floor(midx/2)];
        if (nextM) {
          if (nextM.h === m.h) return m.h;
          if (nextM.h === m.a) return m.a;
          if (nextM.a === m.h) return m.h;
          if (nextM.a === m.a) return m.a;
        }
      }
      return null;
    }

    function clearWCDonwstream(seeds, roundId, midx) {
      const ri = wcRoundMeta.findIndex(r => r.id === roundId);
      if (ri < 0 || ri >= wcRoundMeta.length-1) return;
      const nextId = wcRoundMeta[ri+1].id;
      delete seeds[nextId+'-'+Math.floor(midx/2)];
      clearWCDonwstream(seeds, nextId, Math.floor(midx/2));
    }

    }

    function buildMatchesFromAPI(standings, groupPrefix) {
      const matches = {};
      if (!standings || !standings.standings) return matches;
      standings.standings.forEach(table => {
        if (table.type !== 'TOTAL') return;
        const groupLetter = table.group ? table.group.replace(groupPrefix, '').toLowerCase() : null;
        if (!groupLetter) return;
        const teamNames = {};
        const teamFlags = {};
        table.table.forEach(entry => {
          teamNames[entry.team.id] = entry.team.name;
          teamFlags[entry.team.name] = getFlagFromCountry(entry.team.area ? entry.team.area.name : '');
          TEAM_FLAG_MAP[entry.team.name] = teamFlags[entry.team.name];
          TEAM_TLA[entry.team.shortName || entry.team.tla] = teamFlags[entry.team.name];
        });
        matches[groupLetter] = [];
      });
      return matches;
    }

          if (ri > 0) row.appendChild(document.createElement('span')).className = 'b-conn left';
          if (ri < rounds.length-1) row.appendChild(document.createElement('span')).className = 'b-conn right';
          if (ri < rounds.length-1 && mi%2===0) row.appendChild(document.createElement('span')).className = 'b-conn vert';

          const card = document.createElement('div');
          card.className = 'b-card';

          let hCls = 'b-team top';
          let aCls = 'b-team bottom';
          if (isFT) {
            const hTotal = hAgg !== null && hAgg !== undefined ? hAgg : hScore;
            const aTotal = aAgg !== null && aAgg !== undefined ? aAgg : aScore;
            const hWon = hTotal > aTotal || (hTotal === aTotal && hScore > aScore) || (hTotal === aTotal && hScore === aScore && hPen !== null && hPen > aPen);
            const aWon = aTotal > hTotal || (hTotal === aTotal && aScore > hScore) || (hTotal === aTotal && hScore === aScore && aPen !== null && aPen > aPen);
            if (hWon) hCls += ' picked';
            if (aWon) aCls += ' picked';
          }

          const aggStr = (hAgg !== null && hAgg !== undefined && aAgg !== null && aAgg !== undefined) ? `<span style="font-size:0.65rem;color:var(--muted-foreground);margin-left:3px">agg ${hAgg}-${aAgg}</span>` : '';
          const penStr = (hPen !== null && aPen !== null) ? `<span style="font-size:0.65rem;color:var(--muted-foreground);margin-left:3px">(${hPen}-${aPen} pen)</span>` : '';

          card.innerHTML = `
            <button type="button" class="${hCls}">
              ${hFlag ? `<img src="${flagUrlLg(hFlag)}" alt="" class="b-flag">` : '<span class="b-flag ph"></span>'}
              <span class="b-name">${hName}</span>
              ${isFT ? `<span style="margin-left:auto;font-weight:700;font-size:0.8125rem">${hScore}${aggStr}${penStr}</span>` : ''}
            </button>
            <button type="button" class="${aCls}">
              ${aFlag ? `<img src="${flagUrlLg(aFlag)}" alt="" class="b-flag">` : '<span class="b-flag ph"></span>'}
              <span class="b-name">${aName}</span>
              ${isFT ? `<span style="margin-left:auto;font-weight:700;font-size:0.8125rem">${aScore}</span>` : ''}
            </button>
          `;
          row.appendChild(card);
          matchList.appendChild(row);
        });
        col.appendChild(matchList);
        inner.appendChild(col);
      });

      scroll.appendChild(inner);
      bracket.appendChild(scroll);
    }

    async function loadLeague(leagueKey) {
      currentLeague = leagueKey;
      document.querySelectorAll('.league-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.league === leagueKey));
      updateTitle(leagueKey);
      renderBanner(leagueKey);

      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      const config = COMPETITIONS[leagueKey];

      if (leagueKey === 'wc') {
        document.querySelector('.tabs').style.display = 'inline-flex';
        document.querySelector('.tab[data-tab="groups"]').classList.add('active');
        document.getElementById('groups-view').classList.add('active');
        document.getElementById('knockouts-view').classList.remove('active');
        document.getElementById('league-banner').innerHTML = '';
        document.querySelector('.header-title').textContent = 'FIFA WORLD CUP 2026';
        const grid = document.getElementById('group-grid');
        grid.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><span>Loading World Cup groups...</span></div>';
        await new Promise(r => setTimeout(r, 300));
        renderWCGroups();
        renderWCBracket();
        return;
      }

      document.querySelector('.tabs').style.display = 'inline-flex';
      document.querySelector('.tab[data-tab="groups"]').classList.add('active');
      document.getElementById('groups-view').classList.add('active');
      document.getElementById('knockouts-view').classList.remove('active');

      const grid = document.getElementById('group-grid');
      grid.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><span>Loading ' + currentYear + ' season data...</span></div>';

      let hasStandings = false;
      let hasKnockout = false;

      const standingsData = await fetchLeagueStandings(leagueKey, currentYear);
      const matchesData = await fetchLeagueMatches(leagueKey, currentYear);

      grid.innerHTML = '';

      if (standingsData && standingsData.standings) {
        hasStandings = true;
        const hasGroup = standingsData.standings.some(t => t.group);
        if (hasGroup) {
          renderAPIGroups(standingsData, leagueKey);
        } else {
          renderAPILeagueTable(standingsData, leagueKey);
        }
      }

      if (matchesData && matchesData.matches && matchesData.matches.length > 0) {
        const knockoutStages = ['FINAL','SEMI_FINAL','QUARTER_FINAL','ROUND_OF_16','ROUND_OF_32','PLAYOFF_ROUND','QUALIFYING_PLAYOFF','THIRD_QUALIFYING_ROUND','SECOND_QUALIFYING_ROUND','FIRST_QUALIFYING_ROUND'];
        const knockoutMatches = matchesData.matches.filter(m => knockoutStages.includes(m.stage));

        if (knockoutMatches.length > 0) {
          hasKnockout = true;
          renderAPIKnockout(knockoutMatches, leagueKey);
        } else {
          document.getElementById('bracket').innerHTML = '<div class="b-desc"><h2 class="b-desc-h">Knockout Bracket</h2><p class="b-desc-p">No knockout rounds for this ' + COMPETITIONS[leagueKey].name + ' season.</p></div>';
        }

        renderAPIMatches(matchesData, leagueKey);

      } else {
        document.getElementById('bracket').innerHTML = '<div class="b-desc"><h2 class="b-desc-h">Knockout Bracket</h2><p class="b-desc-p">No match data for this season.</p></div>';
      }

      if (!hasStandings && !matchesData) {
        grid.innerHTML = '<div class="no-data"><h3>No data for ' + COMPETITIONS[leagueKey].name + '</h3><p>Season ' + currentYear + '/' + String(currentYear+1).slice(2) + ' is not available. Try a different year or competition.</p></div>';
      }

      if (!hasKnockout && hasStandings) {
        document.querySelector('.tabs').style.display = 'none';
      }
    }

    const allSearchableLeagues = Object.entries(COMPETITIONS).map(([id, c]) => ({ id, ...c }));

    function searchAll(query) {
      if (!query.trim()) return [];
      const q = query.toLowerCase();
      const results = [];
      allSearchableLeagues.forEach(league => {
        if (league.name.toLowerCase().includes(q) || league.country.toLowerCase().includes(q)) {
          results.push({ type: 'league', league });
        }
      });
      Object.keys(TEAM_FLAG_MAP).forEach(name => {
        if (name.toLowerCase().includes(q)) {
          const league = allSearchableLeagues.find(l => l.id === currentLeague) || allSearchableLeagues[0];
          results.push({ type: 'team', name, flag: TEAM_FLAG_MAP[name], league });
        }
      });
      Object.keys(wcFlags).forEach(name => {
        if (name.toLowerCase().includes(q) && !results.find(r => r.type === 'team' && r.name === name)) {
          results.push({ type: 'team', name, flag: wcFlags[name], league: allSearchableLeagues[0] });
        }
      });
      return results.slice(0, 20);
    }

    function renderSearchResults(results) {
      const el = document.getElementById('search-results');
      el.innerHTML = '';
      if (results.length === 0) {
        el.innerHTML = '<div class="search-no-results">No results found</div>';
        el.style.display = 'block';
        return;
      }
      results.forEach(result => {
        const item = document.createElement('div');
        item.className = 'search-result-item';
        if (result.type === 'league') {
          item.innerHTML = `<div class="search-result-league"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span class="search-result-name">${result.league.name}</span><span class="search-result-type">${result.league.country}</span></div>`;
          item.addEventListener('click', () => {
            loadLeague(result.league.id);
            document.getElementById('search-input').value = '';
            el.style.display = 'none';
          });
        } else {
          item.innerHTML = `<div class="search-result-team"><img src="${flagUrl(result.flag)}" alt="" class="search-result-flag"><span class="search-result-name">${result.name}</span><span class="search-result-league-name">${result.league.name}</span></div>`;
          item.addEventListener('click', () => {
            loadLeague(result.league.id);
            document.getElementById('search-input').value = '';
            el.style.display = 'none';
          });
        }
        el.appendChild(item);
      });
      el.style.display = 'block';
    }

    document.getElementById('search-input').addEventListener('input', e => {
      renderSearchResults(searchAll(e.target.value));
    });
    document.getElementById('search-input').addEventListener('focus', e => {
      if (e.target.value.trim()) renderSearchResults(searchAll(e.target.value));
    });
    document.getElementById('search-clear').addEventListener('click', () => {
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').style.display = 'none';
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.search-container')) document.getElementById('search-results').style.display = 'none';
    });

    document.querySelectorAll('.league-btn').forEach(btn => {
      btn.addEventListener('click', () => loadLeague(btn.dataset.league));
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      localStorage.removeItem(BRACKET_SEED_KEY);
      localStorage.removeItem(STORAGE_KEY);
      loadLeague(currentLeague);
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        const view = document.getElementById(tab.dataset.tab + '-view');
        view.classList.add('active');
        if (tab.dataset.tab === 'knockouts') view.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });

    function updateYearDisplay() {
      const el = document.getElementById('year-display');
      el.textContent = `${currentYear}/${String(currentYear+1).slice(2)}`;
      document.getElementById('year-prev').disabled = currentYear <= YEAR_RANGE.min;
      document.getElementById('year-next').disabled = currentYear >= YEAR_RANGE.max;
    }

    document.getElementById('year-prev').addEventListener('click', () => {
      if (currentYear > YEAR_RANGE.min) {
        currentYear--;
        updateYearDisplay();
        loadLeague(currentLeague);
      }
    });

    document.getElementById('year-next').addEventListener('click', () => {
      if (currentYear < YEAR_RANGE.max) {
        currentYear++;
        updateYearDisplay();
        loadLeague(currentLeague);
      }
    });

    updateYearDisplay();
    loadLeague('wc');
  </script>
</body>
</html>
